<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; outline: none; }

  /* Loading bar */
  .progress { position: absolute; left: 50%; bottom: 50%; width: min(220px, 60%); height: 4px;
    transform: translateX(-50%); background: rgba(128,128,128,.25); border-radius: 2px; overflow: hidden; transition: opacity .4s; }
  .progress.done { opacity: 0; pointer-events: none; }
  .progress .bar { height: 100%; width: 0; background: #1a73e8; transition: width .15s; }
  .loading-text { position: absolute; left: 0; right: 0; top: calc(50% + 12px); text-align: center; font-size: 13px; color: #666; transition: opacity .4s; }
  .loading-text.done { opacity: 0; }

  /* Toolbar */
  .toolbar { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .toolbar button { width: 40px; height: 40px; border: 0; border-radius: 10px; cursor: pointer; font-size: 18px;
    background: rgba(255,255,255,.92); color: #222; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .toolbar button:hover { background: #fff; }
  .toolbar button:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  .toolbar button.on { background: #1a73e8; color: #fff; }

  /* Hotspots */
  .hotspot { display: block; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: #1a73e8;
    box-shadow: 0 1px 4px rgba(0,0,0,.4); cursor: pointer; padding: 0; position: relative; z-index: 3; }
  .hotspot::after { content: "+"; color: #fff; font-size: 16px; line-height: 20px; display: block; text-align: center; }
  .hotspot { transition: opacity .25s; }
  .hotspot:not([data-visible]) { opacity: .6; }
  .hotspot .label { position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: max-content; max-width: 190px;
    background: #fff; color: #222; padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.35; text-align: left;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); opacity: 1; pointer-events: none; transition: opacity .2s; }
  /* Only show a description when its hotspot surface faces the camera. */

  /* Hide both the blue + dot and its description when facing away */
.hotspot.angle-hidden {
  opacity: 0 !important;
  pointer-events: none;
}
  .hotspot.angle-hidden .label { opacity: 0 !important; }
  .hotspot.angle-hidden.open .label { opacity: 1 !important; }
  .hotspot .label strong { display: block; font-size: 13px; margin-bottom: 2px; }
  
/* Stainless Steel Drain information card */
.hotspot .drain-label {
  width: 220px;
  max-width: 220px;
  white-space: normal;
  padding: 12px;
  box-sizing: border-box;
}

/* Auto Drain Valve product photo */
.hotspot .drain-valve-image {
  display: block;
  width: 100%;
  height: 125px;
  object-fit: contain;
  margin: 10px 0;
  border-radius: 6px;
  background: #f5f8fa;
}

/* Optional upgrade message */
.hotspot .upgrade-note {
  display: block;
  margin-top: 10px;
  padding: 9px;
  border-radius: 6px;
  background: #eaf5ff;
  color: #24527a;
  font-size: 12px;
  line-height: 1.5;
}

.hotspot .upgrade-note strong {
  display: block;
  margin-bottom: 4px;
  color: #1769aa;
  font-size: 12px;
}


















  .hotspot .label .desc { display: block; font-size: 12px; color: #555; }
  /* Descriptions hidden: dots stay, hover or tap a dot to read one description */
  .hide-info .hotspot .label { opacity: 0; }
  .hide-info .hotspot:hover .label, .hide-info .hotspot:focus .label, .hide-info .hotspot.open .label { opacity: 1; }

  /* Hint */
  .hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 20px;
    background: rgba(0,0,0,.65); color: #fff; font-size: 13px; transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  .hint.hide { opacity: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <!-- Toolbar -->

    <button id="btnReset" title="Reset view" aria-label="Reset view">&#8962;</button>

  </div>

</model-viewer>

<script>
(function () {
  var mv = document.getElementById('mv');
  mv.classList.add('hide-info');
  var bar = document.getElementById('bar');
  var progress = document.getElementById('progress');
  var loadingText = document.getElementById('loadingText');
  var hint = document.getElementById('hint');
  var btnRotate = document.getElementById('btnRotate');
  var btnInfo = document.getElementById('btnInfo');
  var hotspots = mv.querySelectorAll('.hotspot');
  var idleTimer = null;
  var userWantsRotate = false;

  // Hide labels on surfaces facing away from the current camera angle.
  // Hotspot data-normal values are model-space surface normals.
  function updateHotspotLabelsForView() {
    var orbit;
    try { orbit = mv.getCameraOrbit(); } catch (err) { return; }
    if (!orbit) return;

    // model-viewer orbit: theta is azimuth, phi is polar angle from the top.
    var sinPhi = Math.sin(orbit.phi);
    var cameraX = Math.sin(orbit.theta) * sinPhi;
    var cameraY = Math.cos(orbit.phi);
    var cameraZ = Math.cos(orbit.theta) * sinPhi;

    hotspots.forEach(function (h) {
      var raw = (h.getAttribute('data-normal') || '').match(/-?\d*\.?\d+/g);
      if (!raw || raw.length < 3) return;
      var nx = Number(raw[0]), ny = Number(raw[1]), nz = Number(raw[2]);
      var length = Math.hypot(nx, ny, nz) || 1;
      var facing = (nx * cameraX + ny * cameraY + nz * cameraZ) / length;
      // A small positive threshold avoids labels popping up at grazing angles.
      h.classList.toggle('angle-hidden', facing < 0.18);
    });
  }

  // Loading progress
  mv.addEventListener('progress', function (e) {
    var p = e.detail.totalProgress || 0;
    bar.style.width = (p * 100) + '%';
    if (p >= 1) { progress.classList.add('done'); loadingText.classList.add('done'); }
  });
  mv.addEventListener('load', function () {
    updateHotspotLabelsForView();
    progress.classList.add('done');
    loadingText.classList.add('done');
    setTimeout(function () { hint.classList.add('hide'); }, 4000);
  });
  mv.addEventListener('error', function () {
    loadingText.textContent = 'Failed to load the model. Please refresh the page.';
    loadingText.classList.remove('done');
  });

  // Pause auto-rotate while the user interacts, resume after 4 seconds of idle
  function setRotate(on) {
    if (on) mv.setAttribute('auto-rotate', ''); else mv.removeAttribute('auto-rotate');
    btnRotate.classList.toggle('on', on);
  }
  mv.addEventListener('camera-change', function (e) {
    updateHotspotLabelsForView();
    if (e.detail.source !== 'user-interaction') return;
    hint.classList.add('hide');
    if (!userWantsRotate) return;
    setRotate(false);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { setRotate(true); }, 60000);
  });

  // Toolbar
  btnRotate.addEventListener('click', function () {
    userWantsRotate = !mv.hasAttribute('auto-rotate');
    clearTimeout(idleTimer);
    setRotate(userWantsRotate);
  });
  btnInfo.addEventListener('click', function () {
    var show = mv.classList.toggle('hide-info') === false;
    btnInfo.classList.toggle('on', show);
    if (!show) hotspots.forEach(function (o) { o.classList.remove('open'); });
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    hotspots.forEach(function (o) { o.classList.remove('open'); });
    mv.cameraOrbit = 'auto auto auto';
    mv.cameraTarget = 'auto auto auto';
    mv.fieldOfView = 'auto';
    mv.jumpCameraToGoal();
  });
  document.getElementById('btnFull').addEventListener('click', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
    else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  });

  // Click a hotspot: camera flies to it. Use the reset button to return.
  // hotspots.forEach(function (h) {
  //   h.addEventListener('click', function () {
  //     var pos = h.dataset.position.split(' ').map(parseFloat);
  //     hotspots.forEach(function (o) { o.classList.remove('open'); });
  //     h.classList.add('open');
  //     mv.cameraTarget = pos.join('m ') + 'm';
  //     mv.cameraOrbit = 'auto auto 70%';
  //   });
  // });

  // Debug mode: add ?debug=1 to the URL, then click the model to read hotspot coordinates
  if (location.search.indexOf('debug=1') !== -1) {
    var box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:8px;top:8px;background:#000c;color:#fff;font:12px monospace;padding:6px 8px;border-radius:6px;z-index:9;max-width:70%';
    box.textContent = 'Click the model to get coordinates';
    document.body.appendChild(box);
    mv.addEventListener('click', function (e) {
      var hit = mv.positionAndNormalFromPoint(e.clientX, e.clientY);
      if (hit) box.textContent = 'data-position="' + hit.position.toString() + '"  data-normal="' + hit.normal.toString() + '"';
    });
  }
})();
</script>
</body>
</html>
