<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer</title>

  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100vh;
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>

  <model-viewer
    src="./45-75_opt.glb"
    camera-target="auto"
    camera-orbit="0deg 75deg auto"
    field-of-view="30deg"
    environment-image="neutral"
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
